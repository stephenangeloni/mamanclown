# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare artifact (copy root files, specs, images, EN, FR)
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p public
          
          # Copy root-level regular files (HTML, CSS, JS, SVG, etc.)
          find . -maxdepth 1 -type f \
            -not -name '.git*' \
            -not -name '*.yml' \
            -not -name '*.md' \
            -exec cp {} public/ \; || true
          
          # Copy EN and FR directories
          for d in EN FR; do
            if [ -d "$d" ]; then
              rm -rf "public/$d"
              mkdir -p "public/$d"
              cp -a "$d"/. "public/$d"/
            fi
          done
          
          # Copy specs directory if present
          if [ -d "specs" ]; then
            rm -rf "public/specs"
            mkdir -p "public/specs"
            cp -a specs/. public/specs/
          fi
          
          # Copy images directory if present
          if [ -d "images" ]; then
            rm -rf "public/images"
            mkdir -p "public/images"
            cp -a images/. public/images/
          fi
          
          # Count files to decide if we have artifacts
          count=$(find public -type f | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "✓ Prepared $count files for deployment"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No artifacts to deploy"
          fi
      
      - name: Setup Pages
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/deploy-pages@v4
