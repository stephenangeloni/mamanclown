name: Deploy static site to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content (exclude dot directories)
        run: |
          mkdir -p public
          rsync -av --exclude='.*' --exclude='public' ./ public/
          rm -rf public/.git
          # ensure .nojekyll so GitHub Pages won't run Jekyll unless you want it
          touch public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./public
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}

