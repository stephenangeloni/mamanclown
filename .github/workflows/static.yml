name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content (exclude dot directories)
        run: |
          mkdir -p public
          rsync -av --exclude='.*' --exclude='public' ./ public/
          rm -rf public/.git
          echo "Prepared public/ contents:"
          ls -la public | sed -n '1,200p'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

