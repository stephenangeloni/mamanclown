    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.1/dist/confetti.browser.min.js" defer></script>

    <script defer>
        function triggerConfetti(event) {
            // Only return if the clicked element or its parent has an href
            const target = event.target;
            if (target.hasAttribute('href') || target.closest('[href]')) {
                return;
            }

            // Calculate position relative to viewport
            const x = event.clientX / window.innerWidth;
            const y = event.clientY / window.innerHeight;

            // Create confetti from click position
            confetti({
                particleCount: 200,
                spread: 90,
                origin: {
                    x: x,
                    y: y
                },
                colors: [
                    '#FF0000', // Red
                    '#FF8C00', // Orange
                    '#FFD700', // Yellow
                    '#32CD32', // Lime Green
                    '#00BFFF', // Deep Sky Blue
                    '#4B0082', // Indigo
                    '#9400D3', // Violet
                    '#FF1493'  // Deep Pink
                ],
                startVelocity: 25,
                gravity: 1.0,
                scalar: 1.2
            });
        }
    </script>
