<body data-page="shows" data-lang="en">
    <!-- Header -->
    <header id="site-header">
        <a href="/EN/home.html" aria-label="Home">
            <img src="https://ik.imagekit.io/6b4fz9a3u/mamanclown.webp?tr=w-148,h-60,f-auto,q-80" 
                 alt="Maman Clown" 
                 class="header-logo"
                 width="148"
                 height="60">
        </a>
        <h1 class="page-title">Our shows</h1>
        <div class="header-right">
            <div id="language-switcher" class="language-switcher"></div>
            <button class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
        </div>
    </header>

    <!-- Menu Overlay -->
    <div id="menu-overlay"></div>
    
    <!-- Navigation Menu -->
    <nav id="menu" aria-hidden="true"></nav>

    <!-- Main Content -->
    <main>
        <h2 class="page-heading" aria-hidden="true">Our shows</h2>

        <div class="info-section">
            <img class="card-photo" src="https://ik.imagekit.io/6b4fz9a3u/shows/IMG_4969.webp?tr=w-720,h-540,fo-auto,f-auto,q-80"
                 srcset="https://ik.imagekit.io/6b4fz9a3u/shows/IMG_4969.webp?tr=w-360,h-270,fo-auto,f-auto,q-80 360w, https://ik.imagekit.io/6b4fz9a3u/shows/IMG_4969.webp?tr=w-720,h-540,fo-auto,f-auto,q-80 720w"
                 sizes="(max-width: 640px) 85vw, 300px"
                 alt="Enchanted forest set for a puppet show" width="720" height="540"
                 onerror="this.onerror=null;this.removeAttribute('srcset');this.src='/images/shows/IMG_4969.webp'">
            <h3>For every kind of event</h3>
            <p>
                Private birthdays, corporate events, neighborhood parties, 
                schools, daycare centers, leisure centers in Monaco, Monte-Carlo and the French Riviera.
            </p>
        </div>

        <div class="button-container">
            <a href="/EN/contact.html" class="cta-button">Book a show</a>
        </div>

        <!-- Photo gallery: photos come from images/<data-page>/photos.json -->
        <section class="gallery" aria-labelledby="gallery-title">
            <h3 class="gallery-title" id="gallery-title">In pictures</h3>
        </section>
    </main>

    <!-- Header Navigation Script -->
    <script src="../header.js"></script>

    <!-- Sprinkles Background Script -->
    <script src="../sprinkles.js" defer></script>

    <!-- Photo Gallery Script -->
    <script src="../gallery.js" defer></script>
</body>
