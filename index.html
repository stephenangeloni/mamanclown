    <script defer>
        function triggerConfetti(event) {
            // Only return if the clicked element or its parent has an href
            const target = event.target;
            if (target.hasAttribute('href') || target.closest('[href]')) {
                return;
            }

            // Calculate position relative to viewport
            const x = event.clientX / window.innerWidth;
            const y = event.clientY / window.innerHeight;

            // Create confetti from click position
            confetti({
                particleCount: 200,
                spread: 90,
                origin: {
                    x: x,
                    y: y
                },
                colors: [
                    '#FF0000', // Red
                    '#FF8C00', // Orange
                    '#FFD700', // Yellow
                    '#32CD32', // Lime Green
                    '#00BFFF', // Deep Sky Blue
                    '#4B0082', // Indigo
                    '#9400D3', // Violet
                    '#FF1493'  // Deep Pink
                ],
                startVelocity: 25,
                gravity: 1.0,
                scalar: 1.2
            });
        }
    </script>
    <script defer>
        const colors = ['#FF69B4', '#FFD700', '#00CED1', '#FF6347', '#98FB98', '#DDA0DD'];
        const sprinklesContainer = document.getElementById('sprinkles');

        // Calculate number of sprinkles based on viewport size
        function createSprinkles() {
            // Clear existing sprinkles
            sprinklesContainer.innerHTML = '';

            // Calculate viewport area in pixels
            const viewportArea = window.innerWidth * window.innerHeight;

            // Density: approximately one sprinkle per 10000 square pixels
            const sprinkleDensity = 1 / 1500;
            const numberOfSprinkles = Math.floor(viewportArea * sprinkleDensity);

            for (let i = 0; i < numberOfSprinkles; i++) {
                const sprinkle = document.createElement('div');
                sprinkle.className = 'sprinkle';

                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;

                // Random color
                const color = colors[Math.floor(Math.random() * colors.length)];

                // Random rotation
                const rotation = Math.random() * 360;

                sprinkle.style.cssText = `
                    left: ${x}%;
                    top: ${y}%;
                    background-color: ${color};
                    --rotation: ${rotation}deg;
                    box-shadow: 0 0 1.5px rgba(0,0,0,0.2);
                `;

                sprinklesContainer.appendChild(sprinkle);
            }
        }

        // Create sprinkles initially
        createSprinkles();

        // Recreate sprinkles when window is resized
        window.addEventListener('resize', createSprinkles);

        // Add click event listener for confetti
        document.body.addEventListener('click', triggerConfetti);
    </script>
